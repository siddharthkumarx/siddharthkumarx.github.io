  .tag { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .12em;
         color: var(--teal); text-transform: uppercase; }
  h1 { margin-top: 14px; font-size: clamp(34px, 7vw, 48px); font-weight: 600; color: var(--text); line-height: 1.1; }
  p { margin-top: 16px; font-size: 18px; line-height: 1.6; }
  .links { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line);
           display: flex; flex-wrap: wrap; gap: 12px 28px; }
  a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--teal); padding-bottom: 2px; }
  a:hover { color: var(--teal); }
  .note { margin-top: 28px; font-size: 14px; color: var(--quiet); }
</style>
